          DVEOF
          mkdir -p app_src/app/src/main/java/lt/deivaro/valdiklis
          cat > app_src/app/src/main/java/lt/deivaro/valdiklis/MainActivity.java <<'DVEOF'
          package lt.deivaro.valdiklis;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          public class MainActivity extends Activity {
            private WebView web;
            private final Handler h = new Handler(Looper.getMainLooper());
            private final Runnable grab = new Runnable() { public void run() { readToken(); h.postDelayed(this, 3000); } };
          
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              web.setWebViewClient(new WebViewClient() {
                @Override public void onPageFinished(WebView v, String url) { readToken(); }
              });
              setContentView(web);
              web.loadUrl(PositionsWidget.BASE + "/");
            }
          
            private void readToken() {
              if (web == null) return;
              web.evaluateJavascript("(localStorage.getItem('dvro_token')||localStorage.getItem('dv_token')||'')", v -> {
                if (v == null) return;
                String t = v.replace("\"", "");
                if (t.length() < 8 || t.equals("null")) return;
                String old = getSharedPreferences("dv", MODE_PRIVATE).getString("token", "");
                if (!t.equals(old)) {
                  getSharedPreferences("dv", MODE_PRIVATE).edit().putString("token", t).apply();
                  sendBroadcast(new Intent(PositionsWidget.ACTION).setPackage(getPackageName()));
                }
              });
            }
          
            @Override protected void onResume() { super.onResume(); h.post(grab); }
            @Override protected void onPause() { h.removeCallbacks(grab); super.onPause(); }
            @Override public void onBackPressed() { if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          DVEOF
          mkdir -p app_src/app/src/main/java/lt/deivaro/valdiklis
          cat > app_src/app/src/main/java/lt/deivaro/valdiklis/PositionsWidget.java <<'DVEOF'
          package lt.deivaro.valdiklis;
          
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          
          public class PositionsWidget extends AppWidgetProvider {
            public static final String BASE = "https://trade-production-bbfe.up.railway.app";
            public static final String ACTION = "lt.deivaro.valdiklis.REFRESH";
            static final int GREEN = 0xFF3FCB7E, RED = 0xFFFF7A7A, GOLD = 0xFFC9A24A;
            static final int[] ROW = {R.id.row0, R.id.row1, R.id.row2, R.id.row3, R.id.row4, R.id.row5};
            static final int[] SYM = {R.id.sym0, R.id.sym1, R.id.sym2, R.id.sym3, R.id.sym4, R.id.sym5};
            static final int[] SIDE = {R.id.side0, R.id.side1, R.id.side2, R.id.side3, R.id.side4, R.id.side5};
            static final int[] LOT = {R.id.lot0, R.id.lot1, R.id.lot2, R.id.lot3, R.id.lot4, R.id.lot5};
            static final int[] PL = {R.id.pl0, R.id.pl1, R.id.pl2, R.id.pl3, R.id.pl4, R.id.pl5};
          
            @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids) { schedule(c); refresh(c); }
            @Override public void onEnabled(Context c) { schedule(c); }
            @Override public void onDisabled(Context c) { ((AlarmManager) c.getSystemService(Context.ALARM_SERVICE)).cancel(tick(c)); }
            @Override public void onReceive(Context c, Intent i) {
              super.onReceive(c, i);
              if (ACTION.equals(i.getAction())) refresh(c);
            }
          
            static PendingIntent tick(Context c) {
              return PendingIntent.getBroadcast(c, 1, new Intent(ACTION).setClass(c, PositionsWidget.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }
            static void schedule(Context c) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              am.setInexactRepeating(AlarmManager.ELAPSED_REALTIME, SystemClock.elapsedRealtime() + 60000, 60000, tick(c));
            }
          
            static String fmt(double v) { return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + String.format(Locale.US, "%.2f", Math.abs(v)); }
            static String lot(double v) { String s = String.format(Locale.US, "%.2f", v); return s; }
          
            void refresh(final Context c) {
              final PendingResult pr = goAsync();
              new Thread(() -> {
                try { draw(c); } finally { pr.finish(); }
              }).start();
            }
          
            static void draw(Context c) {
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
              Intent open = new Intent(c, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              v.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(c, 0, open, PendingIntent.FLAG_IMMUTABLE));
              String token = c.getSharedPreferences("dv", Context.MODE_PRIVATE).getString("token", "");
              String upd = new SimpleDateFormat("HH:mm", Locale.US).format(new Date());
              if (token.isEmpty()) {
                msg(v, "Paspausk ir prisijunk prie platformos");
              } else {
                try {
                  HttpURLConnection h = (HttpURLConnection) new URL(BASE + "/api/state").openConnection();
                  h.setRequestProperty("x-token", token);
                  h.setConnectTimeout(10000); h.setReadTimeout(15000);
                  int code = h.getResponseCode();
                  if (code == 401 || code == 403) { msg(v, "Prisijungimas baigėsi - paspausk"); }
                  else if (code != 200) { msg(v, "Platforma neatsako (" + code + ")"); }
                  else {
                    BufferedReader r = new BufferedReader(new InputStreamReader(h.getInputStream(), "UTF-8"));
                    StringBuilder sb = new StringBuilder(); String line;
                    while ((line = r.readLine()) != null) sb.append(line);
                    JSONArray pos = new JSONObject(sb.toString()).optJSONArray("pos");
                    if (pos == null) pos = new JSONArray();
                    double total = 0;
                    for (int i = 0; i < pos.length(); i++) total += pos.getJSONObject(i).optDouble("p", 0);
                    int n = Math.min(pos.length(), ROW.length);
                    for (int i = 0; i < n; i++) {
                      JSONObject p = pos.getJSONObject(i);
                      boolean buy = "buy".equalsIgnoreCase(p.optString("y"));
                      double pl = p.optDouble("p", 0);
                      v.setViewVisibility(ROW[i], View.VISIBLE);
                      v.setTextViewText(SYM[i], p.optString("s"));
                      v.setTextViewText(SIDE[i], buy ? "BUY" : "SELL");
                      v.setTextColor(SIDE[i], buy ? GREEN : RED);
                      v.setTextViewText(LOT[i], lot(p.optDouble("v", 0)));
                      v.setTextViewText(PL[i], fmt(pl));
                      v.setTextColor(PL[i], pl >= 0 ? GREEN : RED);
                    }
                    if (pos.length() == 0) msg(v, "Atvirų pozicijų nėra");
                    else if (pos.length() > ROW.length) msg(v, "+" + (pos.length() - ROW.length) + " daugiau");
                    v.setTextViewText(R.id.total, pos.length() == 0 ? "0.00" : fmt(total));
                    v.setTextColor(R.id.total, pos.length() == 0 ? GOLD : (total >= 0 ? GREEN : RED));
                  }
                } catch (Exception e) {
                  msg(v, "Nėra ryšio");
                }
              }
              v.setTextViewText(R.id.upd, "Atnaujinta " + upd);
              AppWidgetManager.getInstance(c).updateAppWidget(new ComponentName(c, PositionsWidget.class), v);
            }
          
            static void msg(RemoteViews v, String t) { v.setViewVisibility(R.id.msg, View.VISIBLE); v.setTextViewText(R.id.msg, t); }
          }
          DVEOF
      - name: Pastovus raktas
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Surinkti APK
        working-directory: app_src
        run: gradle assembleDebug --no-daemon
      - name: Paskelbti
        run: |
          cp app_src/app/build/outputs/apk/debug/app-debug.apk DeivaroValdiklis.apk
          gh release delete valdiklis -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create valdiklis DeivaroValdiklis.apk -R "$GITHUB_REPOSITORY" -t "Deivaro valdiklis" -n "Atsisiusk ir isidiek telefone."
        env:
          GH_TOKEN: ${{ github.token }}
