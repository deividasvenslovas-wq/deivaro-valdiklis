            <application android:label="Deivaro" android:icon="@drawable/logo" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <receiver android:name=".PositionsWidget" android:exported="true" android:label="Deivaro pozicijos">
                <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                  <action android:name="lt.deivaro.valdiklis.REFRESH"/>
                </intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
              </receiver>
            </application>
          </manifest>
