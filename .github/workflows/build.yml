name: Deivaro valdiklis
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Sukurti projekta
        run: |
          mkdir -p app_src/.
          cat > app_src/settings.gradle <<'DVEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'DeivaroValdiklis'
          include ':app'
          DVEOF
          mkdir -p app_src/.
          cat > app_src/build.gradle <<'DVEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          DVEOF
          mkdir -p app_src/.
          cat > app_src/gradle.properties <<'DVEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          DVEOF
          mkdir -p app_src/app
          cat > app_src/app/build.gradle <<'DVEOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'lt.deivaro.valdiklis'
            compileSdk 34
            defaultConfig { applicationId 'lt.deivaro.valdiklis'; minSdk 26; targetSdk 34; versionCode 3; versionName '1.2' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          DVEOF
          mkdir -p app_src/app/src/main
          cat > app_src/app/src/main/AndroidManifest.xml <<'DVEOF'
