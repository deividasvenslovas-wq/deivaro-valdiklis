            android:resizeMode="horizontal|vertical" android:updatePeriodMillis="1800000"
            android:initialLayout="@layout/widget" android:previewLayout="@layout/widget" android:widgetCategory="home_screen"/>
          DVEOF
          mkdir -p app_src/app/src/main/res/drawable
          cat > app_src/app/src/main/res/drawable/bg.xml <<'DVEOF'
          <?xml version="1.0" encoding="utf-8"?>
